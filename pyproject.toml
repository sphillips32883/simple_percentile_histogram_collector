[project]
name = "simple-percentile-histogram-collector"
version = "0.1.0"
description = "Streaming latency histogram that estimates p50, p95 and p99 via fixed buckets and centroid merging."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
